services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://pricing:pricing@postgres:5432/pricing?sslmode=disable
      HTTP_ADDR: :8080
      MIGRATIONS_PATH: /db/migrations
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["/seed", "--load-db", "--database-url", "postgres://pricing:pricing@postgres:5432/pricing?sslmode=disable"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
